<!doctype html><meta charset="utf-8"><title>banner preview</title>
<style>
 body{margin:0;font:13px ui-monospace,Consolas,monospace;background:#0d1117;color:#8b949e}
 .wrap{padding:18px 20px}
 h2{font-size:12px;letter-spacing:.12em;color:#6e7681;margin:0 0 8px;text-transform:uppercase}
 .dark{background:#0d1117} .light{background:#ffffff}
 .stage{padding:14px;border-radius:8px;margin-bottom:20px}
 img{width:100%;max-width:880px;display:block}
 .btn{position:fixed;right:14px;top:14px;z-index:9}
 button{font:12px monospace;padding:6px 10px;background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;cursor:pointer}
</style>
<div class="btn"><button onclick="reload()">replay</button></div>
<div class="wrap">
  <h2>dark &mdash; on GitHub #0d1117, rendered at 880px like a real README</h2>
  <div class="stage dark"><img id="d" src="../assets/banner-dark.svg" alt=""></div>
  <h2>light &mdash; on #ffffff</h2>
  <div class="stage light"><img id="l" src="../assets/banner-light.svg" alt=""></div>
</div>
<script>
function reload(){for(const id of ['d','l']){const e=document.getElementById(id);const s=e.src.split('?')[0];e.src=s+'?t='+Date.now();}}
</script>
