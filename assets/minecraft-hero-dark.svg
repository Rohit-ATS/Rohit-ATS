<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" width="1400" height="430" role="img" aria-labelledby="title desc">
<title id="title">Rohit Maruri — Minecraft-inspired developer profile</title><desc id="desc">A dark pixel-art Minecraft-inspired landscape with a developer identity card, code fragments, emeralds, redstone and a creeper silhouette.</desc>
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#07131a"/><stop offset="1" stop-color="#102a24"/></linearGradient>
  <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#18251f"/><stop offset="1" stop-color="#0d1512"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7da28b" stroke-opacity=".07"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1400" height="430" fill="url(#sky)"/>
<rect width="1400" height="430" fill="url(#grid)"/>
<!-- moon --> <rect x="1190" y="52" width="92" height="92" fill="#d8e6cf" opacity=".9"/><rect x="1210" y="42" width="82" height="82" fill="#07131a"/>
<!-- distant terrain -->
<path d="M0 292L110 220 188 268 290 176 370 244 470 194 560 270 660 214 750 270 850 178 930 242 1040 184 1140 264 1230 210 1400 286V430H0Z" fill="#132d27"/>
<path d="M0 332L140 276 260 314 370 246 500 314 640 264 760 320 900 252 1040 314 1160 270 1280 322 1400 278V430H0Z" fill="#0d201b"/>
<!-- ground blocks -->
<rect y="354" width="1400" height="76" fill="#111814"/><path d="M0 354h1400v18H0z" fill="#4d6b43"/><path d="M0 372h1400v10H0z" fill="#263a27"/>
<g opacity=".55" fill="#6e7f50"><rect x="85" y="393" width="28" height="7"/><rect x="235" y="382" width="18" height="8"/><rect x="1030" y="399" width="32" height="7"/><rect x="1250" y="386" width="20" height="8"/></g>
<!-- pixel creeper silhouette -->
<g transform="translate(1120 155)" fill="#4f8b4b" opacity=".72"><rect x="0" y="0" width="86" height="118"/><rect x="-10" y="28" width="106" height="75"/><rect x="-35" y="95" width="46" height="130"/><rect x="75" y="95" width="46" height="130"/><rect x="20" y="170" width="46" height="115"/><rect x="-8" y="38" width="22" height="28" fill="#07131a"/><rect x="64" y="38" width="22" height="28" fill="#07131a"/><rect x="31" y="72" width="24" height="25" fill="#07131a"/></g>
<!-- main card -->
<rect x="70" y="52" width="960" height="266" rx="3" fill="#000" opacity=".25"/>
<rect x="58" y="40" width="960" height="266" fill="url(#panel)" stroke="#6f846e" stroke-width="4"/>
<rect x="66" y="48" width="944" height="250" fill="none" stroke="#2c3e31" stroke-width="2"/>
<!-- title plaque -->
<rect x="92" y="70" width="520" height="58" fill="#25352a" stroke="#71866b" stroke-width="3"/>
<text x="116" y="108" fill="#f1f5e9" font-family="monospace" font-weight="800" font-size="34">ROHIT MARURI</text>
<text x="96" y="157" fill="#9fbc9b" font-family="monospace" font-size="16">DEVELOPER  •  BUILDER  •  CS @ SF BAY UNIVERSITY</text>
<text x="96" y="188" fill="#dce8d5" font-family="monospace" font-size="17">I build developer infrastructure, AI systems,</text>
<text x="96" y="213" fill="#dce8d5" font-family="monospace" font-size="17">and tools that turn hard problems into shippable code.</text>
<!-- command line -->
<rect x="92" y="238" width="760" height="44" fill="#07100c" stroke="#314a37"/>
<text x="110" y="266" fill="#70e070" font-family="monospace" font-size="16">&gt;_</text><text x="151" y="266" fill="#c8d7c1" font-family="monospace" font-size="16">craft --mode=ship --tests=true --sleep=optional</text>
<!-- emerald / redstone status -->
<g transform="translate(880 73)"><rect width="96" height="38" fill="#18281c" stroke="#58735a"/><rect x="12" y="10" width="18" height="18" fill="#32d47a" transform="rotate(45 21 19)"/><text x="40" y="25" fill="#d8f5dd" font-family="monospace" font-size="13">ONLINE</text></g>
<g transform="translate(880 121)"><rect width="96" height="38" fill="#281717" stroke="#735353"/><rect x="12" y="10" width="18" height="18" fill="#ff4d4d" transform="rotate(45 21 19)"/><text x="40" y="25" fill="#f5d8d8" font-family="monospace" font-size="13">BUILDING</text></g>
<!-- floating items -->
<g filter="url(#glow)"><rect x="1010" y="260" width="12" height="12" fill="#42e889"/><rect x="1040" y="232" width="8" height="8" fill="#e53935"/><rect x="1080" y="282" width="10" height="10" fill="#42e889"/></g>
<!-- bottom caption -->
<text x="70" y="414" fill="#819481" font-family="monospace" font-size="13">[ ROHIT-ATS / MAIN ]   GRAPH SYSTEMS  ·  AGENT INFRA  ·  DEVELOPER TOOLS</text>
</svg>