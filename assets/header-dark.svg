<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Rohit Maruri — Computer Science at San Francisco Bay University. I build developer infrastructure.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#11161f"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#cfe0ff"/>
      <stop offset="100%" stop-color="#6ea8ff"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f6bff"/>
      <stop offset="55%" stop-color="#0f9b8e"/>
      <stop offset="100%" stop-color="#0f9b8e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2f6bff" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#2f6bff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle cx="985" cy="164" r="250" fill="url(#glow)"/>

    <!-- blast radius motif: concentric rings pushing outward -->
    <g stroke-width="1.25" fill="none">
      <circle cx="985" cy="164" r="30" stroke="#ff5c5c" stroke-opacity="0.85"/>
      <circle cx="985" cy="164" r="30" stroke="#ff5c5c">
        <animate attributeName="r" values="30;132" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.75;0" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="985" cy="164" r="30" stroke="#ff8a3d">
        <animate attributeName="r" values="30;132" dur="4s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.6;0" dur="4s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="985" cy="164" r="30" stroke="#2f6bff">
        <animate attributeName="r" values="30;132" dur="4s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.5;0" dur="4s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="985" cy="164" r="30" stroke="#0f9b8e">
        <animate attributeName="r" values="30;132" dur="4s" begin="3s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.45;0" dur="4s" begin="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="985" cy="164" r="152" stroke="#ffffff" stroke-opacity="0.05"/>
      <circle cx="985" cy="164" r="196" stroke="#ffffff" stroke-opacity="0.03"/>
    </g>
    <circle cx="985" cy="164" r="7" fill="#ff5c5c">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- satellite nodes on the rings -->
    <g fill="#8fb4ff">
      <circle cx="1117" cy="164" r="3" opacity="0.55"/>
      <circle cx="985" cy="32" r="3" opacity="0.45"/>
      <circle cx="1078" cy="257" r="3" opacity="0.5"/>
      <circle cx="892" cy="71" r="3" opacity="0.4"/>
      <circle cx="884" cy="260" r="3" opacity="0.42"/>
    </g>

    <!-- left column -->
    <text x="64" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="3.4" fill="#5eead4" fill-opacity="0.9">COMPUTER SCIENCE &#183; SAN FRANCISCO BAY UNIVERSITY</text>

    <text x="62" y="164" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="66" font-weight="700" letter-spacing="-1.6" fill="url(#name)">Rohit Maruri</text>

    <rect x="64" y="186" width="360" height="2.5" rx="1.25" fill="url(#rule)"/>

    <text x="64" y="226" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" fill="#adbac7">I build developer infrastructure that answers the questions</text>
    <text x="64" y="252" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" fill="#adbac7">other tools <tspan fill="#ffffff" font-weight="600">structurally cannot</tspan>.</text>

    <!-- stat chips -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5">
      <rect x="64" y="278" width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="82" y="297.5" fill="#7ee7d3">381</text><text x="112" y="297.5" fill="#8b949e">tests passing</text>

      <rect x="224" y="278" width="176" height="30" rx="15" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="242" y="297.5" fill="#8fb4ff">100k+</text><text x="286" y="297.5" fill="#8b949e">lines shipped</text>

      <rect x="410" y="278" width="196" height="30" rx="15" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.09"/>
      <text x="428" y="297.5" fill="#ffab70">graph</text><text x="470" y="297.5" fill="#8b949e">&#183; AI &#183; systems</text>
    </g>

    <rect width="1200" height="340" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
</svg>
