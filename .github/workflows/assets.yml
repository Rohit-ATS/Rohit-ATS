name: profile assets

# Regenerates the contribution snake and the stats card, and pushes both to the
# `output` branch. The README reads them from there, not from main - it keeps
# regenerated artwork out of the source branch's history, and it means the profile only
# ever loads SVGs that GitHub itself serves. No third-party image host is in the path.

on:
  schedule:
    # Twice a day. The contribution graph only moves when you push, so anything more
    # frequent just burns Actions minutes.
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

# Required: the job pushes a branch. Without this the token is read-only and the push
# fails with a 403 that reads like an auth problem but is not one.
permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # The first colour in color_dots is the EMPTY cell, not the lightest
          # contribution level. On dark it must be a visible slate: against GitHub's
          # #0d1117 page a near-black empty cell vanishes and the grid looks broken -
          # a snake swimming through nothing.
          outputs: |
            dist/snake-dark.svg?color_snake=%23fafafa&color_dots=%2327272b,%233f3f46,%2371717a,%23a1a1aa,%23e4e4e7
            dist/snake-light.svg?color_snake=%2318181b&color_dots=%23eeeeec,%23d4d4d0,%23a1a1a4,%236b6b74,%2327272b

      # build_stats.py imports design -> fonts, which subsets an OFL webfont into the
      # SVG. Without these the step dies on ImportError, and the card silently stops
      # regenerating while the snake keeps publishing.
      - name: Install the font toolchain
        run: python -m pip install --quiet "fonttools[woff]" brotli

      - name: Generate the stats card
        run: python tools/build_stats.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
